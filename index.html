<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Copy & Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <h1> Meet the Team </h1>
  </header>

  <div class="hero-scroll">
    <div class="hero-track">
      <section class="focus-hero">
        <div class="focus-text">
          <p class="eyebrow">Hey there!</p>
          <h1>I'm Angelica<br>Model/<span class="accent-word">Content</span> Creator</h1>
          <p class="sub">*slogan or quote*</p>
          <button class="pill primary">Learn More</button>
        </div>
        <div class="focus-image" aria-label="Designer wearing headphones looking at city"></div>
      </section>

      <section class="focus-hero alt-1">
        <div class="focus-text">
          <p class="eyebrow">Hello!</p>
          <h1>I'm NAME<br>occupation <span class="accent-word">occupation</span> occupation</h1>
          <p class="sub">*slogan or quote*</p>
          <button class="pill primary">Learn More</button>
        </div>
        <div class="focus-image" aria-label="Designer at laptop in studio"></div>
      </section>

      <section class="focus-hero alt-2">
        <div class="focus-text">
          <p class="eyebrow">Hello!</p>
          <h1>I'm NAME<br>occupation <span class="accent-word">occupation</span> occupation</h1>
          <p class="sub">*slogan or quote*</p>
          <button class="pill primary">Learn More</button>
        </div>
        <div class="focus-image" aria-label="Designer sketching brand concepts"></div>
      </section>

      <section class="focus-hero alt-3">
        <div class="focus-text">
          <p class="eyebrow">Hello!</p>
          <h1>I'm Riley Park<br>occupation <span class="accent-word">occupation</span> occupation</h1>
          <p class="sub">*slogan or quote*</p>
          <button class="pill primary">Learn More</button>
        </div>
        <div class="focus-image" aria-label="Motion designer reviewing frames"></div>
      </section>
    </div>
  </div>
</body>
</html>
